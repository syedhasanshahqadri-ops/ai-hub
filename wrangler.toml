# AI HUB API — deploy with:  npx wrangler deploy
# NOTE: this worker name matches the one your site already calls
# (ai-hub-api.syedhasanshahqadri.workers.dev). Deploying replaces the old code.
name = "ai-hub-api"
main = "index.js"
compatibility_date = "2025-09-01"

[ai]
binding = "AI"

[vars]
# Websites allowed to call this API (comma separated). Add your own domain if you use one.
ALLOWED_ORIGINS = "https://syedhasanshahqadri-ops.github.io,http://localhost:8000,http://127.0.0.1:8000"
# Change models here if Cloudflare renames or retires them (see developers.cloudflare.com/workers-ai/models).
TEXT_MODEL = "@cf/meta/llama-3.1-8b-instruct"
IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
RATE_LIMIT_PER_MIN = "30"
MAX_TOKENS = "1024"
